<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Listing monitor</p>
    <h1>Listing lifecycle</h1>

    <svg viewBox="0 24 960 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-listing-monitor-title 03-listing-monitor-desc">
      <title id="03-listing-monitor-title">Listing lifecycle</title>
      <desc id="03-listing-monitor-desc">State diagram of a tracked listing: each new listing is added to the Google Sheet as Available (with an optional Telegram alert) and, when the opt-in daily check is on, closes as Sold or under offer, or as Off the market once a complete crawl no longer finds it.</desc>
      <!-- Source of truth for the rules drawn here: the "most listings vanished" sanity check
           (>=10 open and <50% seen -> disappearance skipped) lives in src/lifecycle.py run_lifecycle_sweep;
           the sold view's statuses come from src/scraper/site_profile.py DEFAULT_SOLD_STATUS_FILTER
           (under_offer + sold), and every sold-view hit closes as a sale. The daily check is
           lifecycle_sweep_enabled (default False) and Telegram is telegram_enabled (default False), src/config.py. -->
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="24" width="960" height="532" fill="#f5f5f5"/>

      <!-- Composite states (zones), painted first -->
      <rect x="224" y="64" width="208" height="328" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
      <text x="240" y="92" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">OPEN · CHECKED DAILY</text>
      <text x="240" y="108" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">(OPT-IN)</text>
      <rect x="632" y="64" width="288" height="328" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
      <text x="648" y="92" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">CLOSED · DAYS ON MARKET SAVED</text>

      <!-- Transitions (before nodes): r=8 elbows out of Available's top and bottom edges -->
      <line x1="56" y1="240" x2="240" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 328,192 V 160 Q 328,152 336,152 H 648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 328,288 V 320 Q 328,328 336,328 H 648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels: event above, [condition] below -->
      <rect x="92" y="220" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="140" y="230" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW LISTING</text>
      <rect x="64" y="248" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="140" y="258" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[EVERY SEARCH RUN]</text>
      <rect x="480" y="132" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="142" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN SOLD VIEW</text>
      <rect x="444" y="160" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[SOLD OR UNDER OFFER]</text>
      <rect x="484" y="308" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="318" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISAPPEARED</text>
      <rect x="460" y="336" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="346" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[FULL CRAWL ONLY]</text>

      <!-- Start -->
      <circle cx="48" cy="240" r="6" fill="#2d3142"/>

      <!-- States -->
      <rect x="240" y="192" width="176" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="240" y="192" width="176" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Available</text>
      <text x="328" y="256" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">new row in the sheet</text>
      <text x="328" y="272" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Telegram alert (if on)</text>
      <rect x="648" y="104" width="256" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="648" y="104" width="256" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="776" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sold or under offer</text>
      <text x="776" y="168" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">counted as a sale</text>
      <text x="776" y="184" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">feeds the days-to-sell report</text>
      <rect x="648" y="280" width="256" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="648" y="280" width="256" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="776" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Off the market</text>
      <text x="776" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">reason unknown</text>
      <text x="776" y="360" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">not counted as a sale</text>

      <!-- Callout on the disappearance guard -->
      <path d="M 456,436 H 452 Q 444,436 444,428 V 336" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="444" cy="328" r="2" fill="#2d3142"/>
      <text x="464" y="440" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Only a complete crawl can mark a listing gone,</text>
      <text x="464" y="460" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">and not if it misses over half the open listings.</text>

      <!-- Legend strip -->
      <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="132" cy="516" r="5" fill="#2d3142"/>
      <text x="144" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">found by a search run</text>
      <rect x="312" y="508" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">status kept in the listing’s Google Sheet row</text>
      <line x1="660" y1="516" x2="684" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="696" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">what the bot saw [condition]</text>
    </svg>
  </div>
</body>
</html>
