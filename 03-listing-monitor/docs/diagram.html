<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Listing monitor</p>
    <h1>Listing lifecycle</h1>

    <svg viewBox="0 24 960 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-listing-monitor-title 03-listing-monitor-desc">
      <title id="03-listing-monitor-title">Listing lifecycle</title>
      <desc id="03-listing-monitor-desc">State machine showing how each listing moves from new (sheet row plus Telegram alert) through available and under offer to sold or off the market, with every status change written back to its Google Sheet row.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="24" width="960" height="532" fill="#f5f5f5"/>

      <!-- Composite states (zones), painted first -->
      <rect x="176" y="64" width="240" height="336" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
      <text x="200" y="92" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">OPEN · CHECKED DAILY</text>
      <rect x="600" y="64" width="320" height="336" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
      <text x="624" y="92" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">CLOSED · DAYS ON MARKET SAVED</text>

      <!-- Transitions (before nodes) -->
      <line x1="56" y1="152" x2="200" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="296" y1="200" x2="296" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="152" x2="624" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="328" x2="624" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels: event above, [condition] below -->
      <rect x="64" y="132" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="116" y="142" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW LISTING</text>
      <rect x="68" y="160" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="116" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[4× A DAY]</text>
      <rect x="308" y="232" width="104" height="12" rx="2" fill="#efeff0"/>
      <text x="360" y="242" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFER BADGE</text>
      <rect x="468" y="132" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="142" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MARKED SOLD</text>
      <rect x="468" y="308" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="318" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISAPPEARED</text>
      <rect x="444" y="336" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="346" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[FULL CRAWL ONLY]</text>

      <!-- Start -->
      <circle cx="48" cy="152" r="6" fill="#2d3142"/>

      <!-- States -->
      <rect x="200" y="104" width="192" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="104" width="192" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Available</text>
      <text x="296" y="168" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">new row in the sheet</text>
      <text x="296" y="184" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Telegram alert sent</text>
      <rect x="200" y="280" width="192" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="280" width="192" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Under offer</text>
      <text x="296" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">status + date updated</text>
      <text x="296" y="360" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">still on the market</text>
      <rect x="624" y="104" width="272" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="624" y="104" width="272" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="760" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sold</text>
      <text x="760" y="168" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">counted as a sale</text>
      <text x="760" y="184" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">feeds the days-to-sell report</text>
      <rect x="624" y="280" width="272" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="624" y="280" width="272" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="760" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Off the market</text>
      <text x="760" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">reason unknown</text>
      <text x="760" y="360" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">not counted as a sale</text>

      <!-- Callout on the disappearance guard -->
      <path d="M 444,436 H 440 Q 432,436 432,428 V 336" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="432" cy="328" r="2" fill="#2d3142"/>
      <text x="452" y="440" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Only a complete crawl can mark a listing gone,</text>
      <text x="452" y="460" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">and a crawl that loses most listings is ignored.</text>

      <!-- Legend strip -->
      <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="132" cy="516" r="5" fill="#2d3142"/>
      <text x="144" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">found by a search run</text>
      <rect x="312" y="508" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">status kept in the listing’s Google Sheet row</text>
      <line x1="660" y1="516" x2="684" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="696" y="520" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">what the bot saw [and when]</text>
    </svg>
  </div>
</body>
</html>
