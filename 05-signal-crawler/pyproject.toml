[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-crawler"
version = "0.1.0"
description = "Scans the web for mobile apps that have been discontinued while still popular, by detecting people asking for replacement apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",
    "playwright-stealth>=2.0.0",
    "rapidfuzz>=3.10.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
scanner = "scanner.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: typer.Option(...) defaults are the typer idiom.
# B027: BaseScraper.setup/teardown are intentionally optional no-op hooks.
ignore = ["B008", "B027"]
