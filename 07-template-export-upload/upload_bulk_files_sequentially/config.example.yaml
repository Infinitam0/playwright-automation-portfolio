# Copy to config.yaml and fill in. PORTAL_BASE_URL (env) overrides portal.entry_url.
portal:
  entry_url: https://portal.example.com/
  app_url: https://portal.example.com/app/home
  sso_button_name: Sign in with SSO    # UI label on the target site
  account_name: Jane Doe

browser:
  headless: false
  timeout_ms: 30000
  channel: msedge
  profile_name: Default
  user_data_dir: ""

input:
  filename: ../templates_export.xlsx   # written by ../main.py
  sheet_name: Templates

upload:
  max_retries: 2
  retry_delay_ms: 3000
  upload_timeout_ms: 30000
  post_upload_wait_ms: 2000
